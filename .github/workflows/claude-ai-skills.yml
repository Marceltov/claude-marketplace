name: claude.ai skills

# Reusable workflow for the plugin repos (paperless-plugin, trilium-plugin,
# invoiceninja-plugin): checks every skill against claude.ai's rules, zips the
# ones without a .claude-code-only marker, and attaches the zips to a release.
#
# Caller:
#   jobs:
#     skills:
#       uses: Marceltov/claude-marketplace/.github/workflows/claude-ai-skills.yml@main
#       permissions:
#         contents: write
#       with:
#         release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release to attach the zips to; empty means build and check only.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Marceltov/claude-marketplace
          ref: main
          path: .claude-marketplace
          sparse-checkout: scripts
      - name: Check and zip skills
        run: python3 .claude-marketplace/scripts/build-claude-ai-skills.py . --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: claude-ai-skills
          path: dist/*.zip
      - name: Attach zips to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" dist/*.zip --clobber
